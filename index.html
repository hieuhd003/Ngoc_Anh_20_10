
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gửi bạn một bó hồng 🌹</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;overflow-x:hidden;
 background:radial-gradient(ellipse at 50% 48%,#64203c,#260b20 65%,#100711);
 color:#fff0f5;text-align:center;
 font-family:Georgia,serif;
}
#stars,#rain{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.star{position:absolute;color:#ffe5b5;animation:twinkle 2s infinite alternate}
@keyframes twinkle{to{opacity:.15;transform:scale(.5)}}
main{position:relative;z-index:1;width:100%;max-width:700px;margin:auto;padding:24px 12px 30px}
.label{font:11px Arial;letter-spacing:4px;color:#ffb5cf}
h1{font-size:clamp(27px,6vw,43px);font-weight:normal;line-height:1.25;margin:15px 0 8px}
.intro{font:14px/1.8 Arial;color:#f5cbd9}
.stage{height:clamp(350px,65vw,480px);position:relative;display:grid;place-items:center}
.glow{position:absolute;width:260px;height:260px;border-radius:50%;background:#ff32651c;box-shadow:0 0 100px #ff367d40}
#heart{
 position:absolute;z-index:5;border:0;background:none;color:#ff4c83;
 font-size:115px;cursor:pointer;
 filter:drop-shadow(0 0 20px #ff4388);
 animation:beat 1.1s infinite;
}
#heart span{display:block;font:11px Arial;letter-spacing:2px;color:#ffd5e2;margin-top:12px}
@keyframes beat{
 0%,100%{transform:scale(1)}
 15%{transform:scale(1.15)}
 30%{transform:scale(.98)}
 45%{transform:scale(1.2)}
}
#bouquet{
 width:min(100%,500px);height:100%;overflow:visible;
 opacity:0;transform:translateY(25px) scale(.7);
 transition:opacity 1s,transform 1.4s cubic-bezier(.2,.8,.2,1);
}
body.open #bouquet{opacity:1;transform:translateY(0) scale(1)}
body.open #heart{opacity:0;pointer-events:none;transition:opacity .6s}
.flower{
 opacity:0;transform-box:fill-box;transform-origin:center;
}
body.open .flower{animation:flowerOpen 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes flowerOpen{
 0%{opacity:0;transform:scale(.05) rotate(-25deg)}
 70%{opacity:1;transform:scale(1.12) rotate(4deg)}
 100%{opacity:1;transform:scale(1) rotate(0)}
}
.stem{fill:none;stroke:#4caa69;stroke-width:4;stroke-linecap:round}
.leaf{fill:#287e4d;stroke:#76c987;stroke-width:1.5}
.message{
 max-width:520px;margin:4px auto 20px;
 color:#ffe0eb;font-size:clamp(17px,3.5vw,22px);
 line-height:1.7;min-height:80px;
 opacity:0;transition:opacity 1s .7s;
}
body.open .message{opacity:1}
.message em{color:#ff8fb4;font-style:normal}
button.action{
 border:1px solid #ffb3cc;border-radius:30px;
 padding:13px 21px;margin:5px;
 background:linear-gradient(120deg,#a9164c,#ed4c80);
 color:white;cursor:pointer;font-size:13px;
 box-shadow:0 5px 25px #ff397b35;
}
.fall{
 position:absolute;top:-30px;
 animation:fall linear forwards;
 text-shadow:0 0 10px currentColor;
}
@keyframes fall{
 0%{transform:translate(0,-5vh) rotate(0);opacity:0}
 15%{opacity:.9}
 100%{transform:translate(var(--drift),110vh) rotate(var(--spin));opacity:0}
}
.footer{font:10px Arial;letter-spacing:2px;color:#dba6bb;margin-top:20px}
@media(max-height:700px){
 main{padding-top:12px}
 .stage{height:350px}
 h1{margin:8px}
}
</style>
</head>
<body>
<div id="stars"></div>
<div id="rain"></div>

<main>
 <div class="label">MỘT MÓN QUÀ NHỎ · 20 / 10</div>
 <h1>Chúc mừng ngày<br>Phụ nữ Việt Nam</h1>
 <p class="intro">Có một bó hoa đặc biệt dành riêng cho bạn…</p>

 <section class="stage">
  <div class="glow"></div>
  <button id="heart" aria-label="Mở bó hoa">
   ♥<span>CHẠM VÀO TRÁI TIM ✨</span>
  </button>

  <svg id="bouquet" viewBox="0 0 500 480"
       role="img" aria-label="Bó hoa hồng đỏ được vẽ bằng SVG">
   <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
     <stop stop-color="#ffb6ca"/>
     <stop offset=".3" stop-color="#f72d68"/>
     <stop offset=".7" stop-color="#bd073e"/>
     <stop offset="1" stop-color="#5c0925"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
     <stop stop-color="#ffd9e5"/>
     <stop offset=".5" stop-color="#ff719c"/>
     <stop offset="1" stop-color="#bf104b"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
     <stop stop-color="#fff1f5"/>
     <stop offset=".45" stop-color="#f5a5c0"/>
     <stop offset="1" stop-color="#8c1740"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1">
     <stop stop-color="#ffb6cc"/>
     <stop offset=".45" stop-color="#d51b50"/>
     <stop offset="1" stop-color="#6b092b"/>
    </linearGradient>

    <!-- Một bông hồng: các lớp cánh vẽ trực tiếp bằng SVG -->
    <g id="rose">
     <path d="M-5 18 C-48 15 -58 -20 -35 -43
       C-16 -62 5 -42 6 -19 C25 -54 55 -42 58 -17
       C63 9 32 28 5 31Z" fill="url(#red)"/>
     <path d="M-8 20 C-39 39 -65 13 -50 -12
       C-40 -34 -16 -22 -9 -4
       C-25 -35 -3 -51 18 -34
       C42 -14 15 12 -8 20Z" fill="url(#pink)"/>
     <path d="M4 23 C-11 -8 12 -36 35 -21
       C55 -7 39 15 19 29
       C44 17 60 38 41 54
       C20 70 1 46 4 23Z" fill="url(#red)"/>
     <path d="M-10 23 C-34 2 -28 -27 -8 -31
       C13 -35 25 -10 8 9
       C30 -9 47 8 34 29
       C21 47 -5 41 -10 23Z" fill="url(#pink)"/>
     <path d="M-12 17 C-29 -1 -11 -23 5 -15
       C20 -8 12 7 3 13
       C19 5 30 20 18 30
       C5 40 -9 28 -12 17Z" fill="#bd1045"/>
     <path d="M-3 12 C-11 1 -1 -8 7 -2
       C14 5 4 14 -3 12Z" fill="#ffb2c8"/>
     <path d="M-32 -29 Q-17 -46 -3 -32"
       fill="none" stroke="#ffdce6" stroke-width="2" opacity=".8"/>
    </g>

    <g id="leaves">
     <path d="M0 0 C-30 -35 -57 -22 -52 -5
       C-37 14 -13 12 0 0Z" class="leaf"/>
     <path d="M0 0 C26 -35 53 -26 51 -10
       C37 10 13 12 0 0Z" class="leaf"/>
     <path d="M-2 0 L-40 -8 M2 0 L39 -12"
       stroke="#a3e5a9" fill="none"/>
    </g>
   </defs>

   <!-- Cành hoa -->
   <g class="stems">
    <path class="stem" d="M250 245 Q235 320 250 404"/>
    <path class="stem" d="M180 235 Q185 322 235 406"/>
    <path class="stem" d="M320 235 Q315 325 264 406"/>
    <path class="stem" d="M130 264 Q157 344 222 407"/>
    <path class="stem" d="M370 264 Q341 344 278 407"/>
    <path class="stem" d="M220 275 Q210 340 244 405"/>
    <path class="stem" d="M285 280 Q298 350 258 405"/>
    <use href="#leaves" x="194" y="335" transform="rotate(-15 194 335)"/>
    <use href="#leaves" x="301" y="342" transform="rotate(18 301 342)"/>
    <use href="#leaves" x="165" y="359" transform="rotate(-25 165 359)"/>
    <use href="#leaves" x="327" y="321" transform="rotate(25 327 321)"/>
    <use href="#leaves" x="243" y="375" transform="rotate(-8 243 375)"/>
   </g>

   <!-- Giấy gói phía sau -->
   <path d="M75 215 Q155 260 184 278
     L225 422 Q135 393 105 330Z"
     fill="url(#paper)" stroke="#ffdce6" stroke-width="2"/>
   <path d="M425 215 Q345 260 316 278
     L275 422 Q365 393 395 330Z"
     fill="url(#paper)" stroke="#ffdce6" stroke-width="2"/>

   <!-- Mặt giấy gói trước -->
   <path d="M92 248 Q150 282 205 284
     Q250 310 295 284 Q350 282 408 248
     L352 374 Q250 428 148 374Z"
     fill="url(#paper)" stroke="#ffc4d7" stroke-width="2"/>
   <path d="M91 248 Q142 294 178 313 L151 371Z"
     fill="#fff2f6" opacity=".65"/>
   <path d="M409 248 Q358 294 322 313 L349 371Z"
     fill="#fff2f6" opacity=".6"/>

   <!-- 10 bông hồng, mỗi bông có thời gian nở khác nhau -->
   <g class="flower" style="animation-delay:.15s">
    <use href="#rose" transform="translate(150 212) scale(.72)"/>
   </g>
   <g class="flower" style="animation-delay:.35s">
    <use href="#rose" transform="translate(205 178) scale(.82)"/>
   </g>
   <g class="flower" style="animation-delay:.5s">
    <use href="#rose" transform="translate(270 172) scale(.9)"/>
   </g>
   <g class="flower" style="animation-delay:.65s">
    <use href="#rose" transform="translate(340 211) scale(.75)"/>
   </g>
   <g class="flower" style="animation-delay:.8s">
    <use href="#rose" transform="translate(121 260) scale(.72)"/>
   </g>
   <g class="flower" style="animation-delay:1s">
    <use href="#rose" transform="translate(183 244) scale(.92)"/>
   </g>
   <g class="flower" style="animation-delay:1.2s">
    <use href="#rose" transform="translate(250 237) scale(1.02)"/>
   </g>
   <g class="flower" style="animation-delay:1.4s">
    <use href="#rose" transform="translate(320 252) scale(.9)"/>
   </g>
   <g class="flower" style="animation-delay:1.6s">
    <use href="#rose" transform="translate(208 293) scale(.77)"/>
   </g>
   <g class="flower" style="animation-delay:1.8s">
    <use href="#rose" transform="translate(283 294) scale(.78)"/>
   </g>

   <!-- Nơ lớn ở cuống bó hoa -->
   <g class="flower" style="animation-delay:2.2s">
    <path d="M239 378 Q190 341 172 370
      Q160 392 231 405 L207 435
      Q204 452 239 428Z"
      fill="url(#ribbon)" stroke="#ffb6cc" stroke-width="2"/>
    <path d="M261 378 Q310 341 328 370
      Q340 392 269 405 L293 435
      Q296 452 261 428Z"
      fill="url(#ribbon)" stroke="#ffb6cc" stroke-width="2"/>
    <path d="M235 396 L229 452 L250 439
      L271 452 L265 396Z"
      fill="url(#ribbon)" stroke="#ffb6cc" stroke-width="2"/>
    <ellipse cx="250" cy="391" rx="22" ry="15"
      fill="url(#ribbon)" stroke="#ffd1df" stroke-width="2"/>
    <text x="250" y="418" text-anchor="middle"
      font-size="10" fill="#ffe7bf" font-style="italic">For You</text>
   </g>
  </svg>
 </section>

 <p class="message" id="message">
 Chúc bạn luôn <em>xinh đẹp, rạng rỡ</em>, bình an và được yêu thương thật nhiều.
 Mong những điều ngọt ngào nhất sẽ nở hoa trong cuộc sống của bạn. 🌹
 </p>

 <div>
  <button class="action" id="wish">♡ Nhận thêm lời chúc</button>
  <button class="action" id="again">↻ Mở lại bó hoa</button>
 </div>
 <div class="footer">GỬI TRỌN YÊU THƯƠNG · 20 / 10</div>
</main>

<script>
const stars=document.getElementById('stars');
const rain=document.getElementById('rain');

for(let i=0;i<75;i++){
 const s=document.createElement('span');
 s.className='star';s.textContent='✦';
 s.style.left=Math.random()*100+'%';
 s.style.top=Math.random()*100+'%';
 s.style.fontSize=(4+Math.random()*8)+'px';
 s.style.animationDelay=Math.random()*3+'s';
 stars.appendChild(s);
}

function fall(){
 const el=document.createElement('span');
 el.className='fall';
 el.textContent=Math.random()>.45?'♥':['❀','✿','🌸'][Math.floor(Math.random()*3)];
 el.style.left=Math.random()*100+'%';
 el.style.fontSize=(12+Math.random()*17)+'px';
 el.style.color=Math.random()>.5?'#ff8fb5':'#ffd1e0';
 el.style.animationDuration=(6+Math.random()*7)+'s';
 el.style.setProperty('--drift',((Math.random()-.5)*160)+'px');
 el.style.setProperty('--spin',((Math.random()-.5)*500)+'deg');
 rain.appendChild(el);
 setTimeout(()=>el.remove(),14000);
}

let rainTimer;
function openGift(){
 document.body.classList.add('open');
 for(let i=0;i<30;i++)setTimeout(fall,i*90);
 clearInterval(rainTimer);
 rainTimer=setInterval(fall,450);
}
document.getElementById('heart').addEventListener('click',openGift);

const wishes=[
'Chúc bạn luôn <em>xinh đẹp, rạng rỡ</em>, bình an và được yêu thương thật nhiều. Mong những điều ngọt ngào nhất sẽ nở hoa trong cuộc sống của bạn. 🌹',
'Bạn xứng đáng với mọi điều <em>dịu dàng nhất</em> trên thế gian. Mong nụ cười luôn ở trên môi và trái tim luôn đầy ắp niềm vui. 💗',
'Gửi bạn một bó hồng, một lời chúc và thật nhiều thương mến. Chúc ngày 20/10 ngập tràn hạnh phúc! ✨',
'Mong bạn luôn tự tin tỏa sáng theo cách riêng, được trân trọng, được nâng niu và luôn hạnh phúc. 🌷',
'Chúc cô gái tuyệt vời có một ngày thật ngọt ngào, nhận được thật nhiều yêu thương và luôn nhớ rằng mình rất đặc biệt. 💖'
];
let index=0;
document.getElementById('wish').addEventListener('click',()=>{
 index=(index+1)%wishes.length;
 const m=document.getElementById('message');
 m.style.opacity=0;
 setTimeout(()=>{m.innerHTML=wishes[index];m.style.opacity=1},250);
 for(let i=0;i<12;i++)setTimeout(fall,i*100);
});
document.getElementById('again').addEventListener('click',()=>{
 document.body.classList.remove('open');
 clearInterval(rainTimer);
 index=0;
 document.getElementById('message').innerHTML=wishes[0];
 window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
