
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#260817">
<title>Một bông hồng dành riêng cho Ngọc Anh 🌹</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --pink: #ff5c97;
  --light-pink: #ffd6e5;
}

html {
  min-height: 100%;
  background: #260817;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at 50% 38%, #641638 0%, #3b0c26 45%, #180611 100%);
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

.page {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 14px max(24px, env(safe-area-inset-bottom));
  position: relative;
  isolation: isolate;
}

.glow {
  position: fixed;
  width: 280px;
  height: 280px;
  left: 50%;
  top: 40%;
  transform: translate(-50%, -50%);
  background: #ff347a;
  filter: blur(100px);
  opacity: .17;
  pointer-events: none;
  z-index: -1;
}

/* TIÊU ĐỀ */
.heading {
  width: 100%;
  max-width: 450px;
  margin: 0 0 5px;
  font-size: clamp(22px, 5.5vw, 31px);
  line-height: 1.4;
  text-align: center;
  color: #ffe4ed;
  text-shadow: 0 0 18px #ff5c97a0;
  letter-spacing: .3px;
}

.subtitle {
  margin: 3px 0 0;
  color: #ff9cbe;
  text-align: center;
  font-size: clamp(27px, 7vw, 36px);
  font-weight: bold;
  letter-spacing: 3px;
  text-shadow: 0 0 15px #ff4d8d99;
}

/* KHU VỰC HOA HỒNG */
.flower-stage {
  position: relative;
  width: min(94vw, 430px);
  height: min(62vh, 470px);
  min-height: 340px;
  max-height: 470px;
  margin: 0 auto;
  flex: 0 0 auto;
}

#rose {
  position: absolute;
  width: 100%;
  height: 100%;
  inset: 0;
  overflow: visible;
}

.stem {
  stroke-dasharray: 500;
  stroke-dashoffset: 500;
}

body.open .stem {
  animation: drawStem 1.8s ease forwards;
}

@keyframes drawStem {
  to { stroke-dashoffset: 0; }
}

.leaf {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center;
  transform: scale(0);
}

body.open .leaf {
  animation: leafGrow .7s ease forwards;
}

body.open .leaf.left {
  animation-delay: 1.05s;
}

body.open .leaf.right {
  animation-delay: 1.35s;
}

@keyframes leafGrow {
  to {
    opacity: 1;
    transform: scale(1);
  }
}

/* CÁNH HOA NỞ DẦN */
.petal {
  opacity: 0;
  transform-box: fill-box;
  transform-origin: center bottom;
  transform: scale(.05) rotate(-8deg);
}

body.open .petal {
  animation: petalOpen 1.1s cubic-bezier(.2,.8,.2,1) forwards;
}

@keyframes petalOpen {
  0% {
    opacity: 0;
    transform: scale(.05) rotate(-8deg);
  }
  65% {
    opacity: 1;
    transform: scale(1.08) rotate(3deg);
  }
  100% {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
}

/* TRÁI TIM BAN ĐẦU */
#heartStart {
  position: absolute;
  z-index: 10;
  top: 37%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 112px;
  height: 112px;
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  transition: opacity .6s, visibility .6s;
}

.heart {
  width: 100%;
  height: 100%;
  display: block;
  filter: drop-shadow(0 0 12px #ff477f);
  animation: heartBeat 1.1s ease-in-out infinite;
}

@keyframes heartBeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.13); }
  30% { transform: scale(1); }
  45% { transform: scale(1.1); }
}

.heart-label {
  position: absolute;
  left: 50%;
  top: calc(100% + 7px);
  transform: translateX(-50%);
  width: 190px;
  color: #ffd6e5;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 1px;
  text-shadow: 0 0 10px #ff5c97;
  white-space: nowrap;
}

body.open #heartStart {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

/* LỜI CHÚC VÀ NÚT NHẬN THÊM */
.wish-box {
  position: relative;
  z-index: 20;
  width: min(92%, 370px);
  margin: -7px auto 0;
  text-align: center;
  opacity: 0;
  visibility: hidden;
  transform: translateY(14px);
  transition:
    opacity .7s ease,
    transform .7s ease,
    visibility .7s ease;
  pointer-events: none;
}

body.open .wish-box {
  opacity: 1;
  visibility: visible;
  transform: translateY(-8px);
  pointer-events: auto;
}

#wish {
  margin: 0 auto 14px;
  color: #fff0f5;
  font-size: clamp(17px, 4.5vw, 21px);
  font-weight: 500;
  line-height: 1.6;
  overflow-wrap: anywhere;
  text-shadow: 0 2px 12px #ff4d8d66;
}

#moreWish {
  position: relative;
  z-index: 30;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 54px;
  max-width: 100%;
  padding: 14px 24px;
  margin: 0 auto;
  border: 1px solid #ffffff65;
  border-radius: 30px;
  background: linear-gradient(135deg, #ff78a6, #ff347b);
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  box-shadow: 0 5px 20px #ff2f7855;
  transition: transform .15s, box-shadow .2s;
}

#moreWish:active {
  transform: scale(.96);
  box-shadow: 0 2px 9px #ff2f7880;
}

.footer {
  position: relative;
  z-index: 2;
  margin: 15px 0 0;
  color: #e9a7c1;
  font-size: 12px;
  text-align: center;
  letter-spacing: .7px;
}

/* CÁNH HOA VÀ TRÁI TIM RƠI */
.falling {
  position: fixed;
  top: -30px;
  z-index: 1;
  pointer-events: none;
  opacity: 0;
  animation: fallDown linear forwards;
}

@keyframes fallDown {
  0% {
    transform: translate3d(0, -20px, 0) rotate(0);
    opacity: 0;
  }
  10% { opacity: .9; }
  90% { opacity: .7; }
  100% {
    transform: translate3d(var(--drift), 110vh, 0) rotate(480deg);
    opacity: 0;
  }
}

/* TỐI ƯU ĐIỆN THOẠI */
@media (max-width: 600px) {
  .page {
    justify-content: flex-start;
    padding-top: max(22px, env(safe-area-inset-top));
  }

  .heading {
    max-width: 360px;
  }

  .flower-stage {
    width: min(100vw, 390px);
    height: min(49vh, 390px);
    min-height: 300px;
    margin-top: 3px;
  }

  #heartStart {
    width: 96px;
    height: 96px;
    top: 37%;
  }

  .wish-box {
    width: min(94%, 370px);
    margin-top: 3px;
    padding-bottom: 8px;
  }

  body.open .wish-box {
    transform: translateY(-5px);
  }

  #wish {
    margin-bottom: 12px;
  }

  #moreWish {
    min-height: 54px;
    padding: 14px 22px;
    font-size: 16px;
  }

  .footer {
    margin-top: 10px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<div class="glow"></div>

<main class="page">

  <h1 class="heading">Một bông hồng dành riêng cho em</h1>
  <p class="subtitle">Ngọc Anh</p>

  <section class="flower-stage" aria-label="Bông hồng dành cho Ngọc Anh">

    <svg id="rose" viewBox="0 0 400 520"
         xmlns="http://www.w3.org/2000/svg"
         role="img" aria-label="Hoa hồng vẽ bằng mã">

      <defs>
        <linearGradient id="stemColor" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#245a36"/>
          <stop offset=".5" stop-color="#62b76b"/>
          <stop offset="1" stop-color="#17462e"/>
        </linearGradient>

        <linearGradient id="leafColor" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a6e68c"/>
          <stop offset=".5" stop-color="#39985a"/>
          <stop offset="1" stop-color="#145332"/>
        </linearGradient>

        <linearGradient id="petalOuter" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff9bbd"/>
          <stop offset=".45" stop-color="#f43f79"/>
          <stop offset="1" stop-color="#a90e48"/>
        </linearGradient>

        <linearGradient id="petalLight" x1="0" y1="0" x2=".8" y2="1">
          <stop offset="0" stop-color="#ffd0df"/>
          <stop offset=".5" stop-color="#ff6898"/>
          <stop offset="1" stop-color="#df1f62"/>
        </linearGradient>

        <linearGradient id="petalDark" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff79a5"/>
          <stop offset=".55" stop-color="#d91b5a"/>
          <stop offset="1" stop-color="#790d3a"/>
        </linearGradient>

        <filter id="flowerGlow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="7" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Thân hoa -->
      <path class="stem"
        d="M200 488 C197 410 211 345 202 279 C199 250 202 230 205 215"
        fill="none" stroke="url(#stemColor)"
        stroke-width="8" stroke-linecap="round"/>

      <!-- Lá trái -->
      <g class="leaf left">
        <path d="M202 383 C164 365 128 376 117 340
                 C151 333 186 346 202 383Z"
          fill="url(#leafColor)" stroke="#a2dc8a" stroke-width="1.2"/>
        <path d="M126 343 Q162 354 198 380"
          fill="none" stroke="#c2efa4" stroke-width="1.5"/>
      </g>

      <!-- Lá phải -->
      <g class="leaf right">
        <path d="M203 331 C228 294 270 292 287 263
                 C299 306 255 334 203 331Z"
          fill="url(#leafColor)" stroke="#a2dc8a" stroke-width="1.2"/>
        <path d="M211 326 Q251 303 284 270"
          fill="none" stroke="#c2efa4" stroke-width="1.5"/>
      </g>

      <!-- Đài hoa -->
      <path class="petal" style="animation-delay:.6s"
        d="M178 225 L158 196 L191 211 L207 182
           L216 213 L249 194 L230 227Z"
        fill="#398a4c"/>

      <!-- Cánh hoa ngoài -->
      <g filter="url(#flowerGlow)">
        <path class="petal" style="animation-delay:.15s"
          d="M204 218
             C159 224 128 194 135 155
             C139 120 172 103 199 130
             C222 95 268 107 282 143
             C302 190 262 220 204 218Z"
          fill="url(#petalOuter)"/>

        <path class="petal" style="animation-delay:.3s"
          d="M203 212
             C164 209 144 180 156 148
             C168 118 194 120 207 147
             C228 119 257 129 267 157
             C279 190 244 214 203 212Z"
          fill="url(#petalDark)"/>

        <!-- Cánh trái -->
        <path class="petal" style="animation-delay:.45s"
          d="M201 209
             C169 190 166 157 184 138
             C205 116 225 140 224 164
             C222 183 213 198 201 209Z"
          fill="url(#petalLight)"/>

        <!-- Cánh phải -->
        <path class="petal" style="animation-delay:.6s"
          d="M204 211
             C222 180 245 170 258 183
             C273 201 245 218 204 211Z"
          fill="url(#petalOuter)"/>

        <!-- Cánh giữa -->
        <path class="petal" style="animation-delay:.75s"
          d="M199 202
             C181 184 183 161 201 151
             C221 142 239 160 229 179
             C222 192 210 199 199 202Z"
          fill="url(#petalLight)"/>

        <path class="petal" style="animation-delay:.9s"
          d="M202 199
             C190 184 197 166 210 165
             C225 165 230 180 220 191
             C215 197 209 200 202 199Z"
          fill="url(#petalDark)"/>

        <!-- Cánh cuộn trong cùng -->
        <path class="petal" style="animation-delay:1.05s"
          d="M203 190
             C194 181 201 173 209 175
             C216 177 216 185 209 190
             C219 188 222 180 217 174
             C208 164 192 172 192 183
             C192 193 201 198 211 195Z"
          fill="url(#petalLight)"/>
      </g>

      <!-- Điểm sáng trên cánh -->
      <path d="M150 154 Q157 126 181 127"
        fill="none" stroke="#ffd5e4" stroke-width="2"
        stroke-linecap="round" opacity=".55"/>
      <path d="M231 123 Q255 129 264 151"
        fill="none" stroke="#ffd5e4" stroke-width="2"
        stroke-linecap="round" opacity=".5"/>
    </svg>

    <!-- Trái tim bấm để hoa nở -->
    <button id="heartStart" type="button" aria-label="Bấm trái tim để mở hoa">
      <svg class="heart" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="heartGradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffb1cc"/>
            <stop offset=".5" stop-color="#ff3f83"/>
            <stop offset="1" stop-color="#d70d59"/>
          </linearGradient>
        </defs>
        <path d="M50 87
                 C41 78 10 55 10 32
                 C10 7 39 3 50 24
                 C62 3 90 7 90 32
                 C90 55 60 78 50 87Z"
          fill="url(#heartGradient)"
          stroke="#ffd5e4" stroke-width="2"/>
        <path d="M24 28 Q27 17 38 21"
          fill="none" stroke="#fff" stroke-width="4"
          stroke-linecap="round" opacity=".8"/>
      </svg>
      <span class="heart-label">Anh nhớ em nhiều lắm ❤️</span>
    </button>

  </section>

  <!-- Chỉ hiện sau khi bấm trái tim -->
  <section class="wish-box" id="wishBox" aria-live="polite">
    <p id="wish">
      Chúc em ngày 20/10 thật xinh đẹp, hạnh phúc
      và luôn được anh yêu thương! 💖
    </p>

    <button id="moreWish" type="button">
      💌 Nhận thêm lời chúc
    </button>
  </section>

  <p class="footer">Một bông hoa nhỏ, gửi ngàn yêu thương 🌹</p>

</main>

<script>
const body = document.body;
const heartButton = document.getElementById("heartStart");
const wishText = document.getElementById("wish");
const moreWishButton = document.getElementById("moreWish");

const wishes = [
  "Chúc em ngày 20/10 thật xinh đẹp, hạnh phúc và luôn được anh yêu thương! 💖",
  "Ngọc Anh à, mong mọi điều dịu dàng nhất sẽ đến với em, hôm nay và cả những ngày sau. 🌷",
  "Chúc em luôn rạng rỡ như hoa hồng, tự tin và vui vẻ mỗi ngày. 🌹",
  "Anh mong em có thật nhiều niềm vui, luôn được trân trọng và yêu thương. 💕",
  "Mong nụ cười luôn nở trên môi em và những điều tốt đẹp luôn ở bên em. ✨",
  "Chúc em luôn bình an, mạnh mẽ và gặp thật nhiều may mắn trong cuộc sống. 🩷",
  "Ngọc Anh, hãy luôn vui vẻ nhé. Anh mong mỗi ngày của em đều có thật nhiều điều đáng yêu. 🌸",
  "Em xứng đáng với những điều đẹp đẽ nhất. Anh sẽ luôn mong em hạnh phúc! 💐",
  "Nếu hoa hồng tượng trưng cho tình yêu, thì bông hoa này là dành riêng cho em. ❤️",
  "Anh yêu em, hôm nay, ngày mai và cả những ngày sau nữa, anh chờ em !. 💗"
];

let wishIndex = 0;
let opened = false;
let fallingStarted = false;
let fallingTimer = null;

/* Bấm trái tim để hoa nở và hiện lời chúc */
heartButton.addEventListener("click", function () {
  if (opened) return;

  opened = true;
  body.classList.add("open");
  startFallingPetals();
});

/* Mỗi lần bấm nút sẽ đổi lời chúc */
moreWishButton.addEventListener("click", function () {
  wishIndex = (wishIndex + 1) % wishes.length;

  wishText.animate(
    [
      { opacity: 1, transform: "translateY(0)" },
      { opacity: 0, transform: "translateY(7px)" }
    ],
    { duration: 180, fill: "forwards" }
  ).onfinish = function () {
    wishText.textContent = wishes[wishIndex];

    wishText.animate(
      [
        { opacity: 0, transform: "translateY(7px)" },
        { opacity: 1, transform: "translateY(0)" }
      ],
      { duration: 350, fill: "forwards" }
    );
  };
});

/* Tạo cánh hoa và trái tim rơi */
function startFallingPetals() {
  if (fallingStarted) return;
  fallingStarted = true;

  const symbols = ["🌸", "💗", "🌷", "💕"];

  function createPetal() {
    if (!body.classList.contains("open")) return;

    const item = document.createElement("span");
    item.className = "falling";
    item.textContent = symbols[
      Math.floor(Math.random() * symbols.length)
    ];

    item.style.left = Math.random() * 100 + "vw";
    item.style.fontSize = (13 + Math.random() * 13) + "px";
    item.style.animationDuration = (5 + Math.random() * 5) + "s";
    item.style.setProperty(
      "--drift",
      (Math.random() * 150 - 75) + "px"
    );

    document.body.appendChild(item);

    setTimeout(function () {
      item.remove();
    }, 11000);
  }

  for (let i = 0; i < 12; i++) {
    setTimeout(createPetal, i * 180);
  }

  fallingTimer = setInterval(createPetal, 650);
}
</script>
</body>
</html>
