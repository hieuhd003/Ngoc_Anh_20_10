
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Một bông hồng dành cho em 🌹</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;overflow:hidden;
 display:flex;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at 50% 48%,#53172f,#210b20 65%,#100711);
 color:#ffe8f0;font-family:Georgia,serif;text-align:center
}
#stars,#rain{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.star{position:absolute;color:#ffe2ae;animation:twinkle 2s infinite alternate}
@keyframes twinkle{to{opacity:.15;transform:scale(.5)}}
main{position:relative;z-index:1;width:100%;max-width:600px;padding:20px 12px}
.small{font:11px Arial;letter-spacing:4px;color:#ffb2cd}
h1{font-size:clamp(28px,6vw,42px);font-weight:normal;margin:14px 0 5px}
.subtitle{font:14px/1.8 Arial;color:#e9bacb}
.stage{height:min(62vh,480px);min-height:340px;position:relative;display:grid;place-items:center}
svg{width:min(94vw,430px);height:100%;overflow:visible}
#rose{opacity:0;transition:opacity .5s}
body.open #rose{opacity:1}
.stem{
 fill:none;stroke:#41945a;stroke-width:5;stroke-linecap:round;
 stroke-dasharray:300;stroke-dashoffset:300
}
body.open .stem{animation:grow 2s ease-out forwards}
@keyframes grow{to{stroke-dashoffset:0}}
.leaf{
 fill:#267848;stroke:#65b879;stroke-width:1.5;
 transform-box:fill-box;transform-origin:bottom center;
 opacity:0;transform:scale(0)
}
body.open .leaf{animation:leafOpen .9s ease-out forwards}
@keyframes leafOpen{to{opacity:1;transform:scale(1)}}
.petal{
 opacity:0;transform-box:fill-box;transform-origin:center;
 transform:scale(.05) rotate(-25deg)
}
body.open .petal{animation:petalOpen 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes petalOpen{
 0%{opacity:0;transform:scale(.05) rotate(-25deg)}
 65%{opacity:1;transform:scale(1.12) rotate(5deg)}
 100%{opacity:1;transform:scale(1) rotate(0)}
}
#bud{
 position:absolute;z-index:4;border:0;background:none;
 color:#ff4a82;font-size:100px;cursor:pointer;
 filter:drop-shadow(0 0 20px #ff3f7d);
 animation:heartbeat 1.15s infinite
}
#bud span{display:block;font:11px Arial;letter-spacing:2px;color:#ffd1e0;margin-top:12px}
body.open #bud{opacity:0;pointer-events:none;transition:opacity .7s}
@keyframes heartbeat{
 0%,100%{transform:scale(1)}
 15%{transform:scale(1.13)}
 30%{transform:scale(.98)}
 45%{transform:scale(1.18)}
}
.message{
 max-width:460px;margin:0 auto 16px;
 font-size:clamp(17px,3.5vw,22px);line-height:1.7;
 color:#ffe2ec;opacity:0;transition:opacity 1s 1.8s
}
body.open .message{opacity:1}
.message em{font-style:normal;color:#ff8eb5}
.action{
 border:1px solid #ffafc8;border-radius:30px;padding:13px 22px;
 color:white;background:linear-gradient(120deg,#a9164c,#ed4c80);
 cursor:pointer;font-size:13px;box-shadow:0 5px 25px #ff397b30
}
.fall{
 position:absolute;top:-30px;animation:fall linear forwards;
 text-shadow:0 0 12px currentColor
}
@keyframes fall{
 0%{transform:translate(0,-5vh) rotate(0);opacity:0}
 15%{opacity:.9}
 100%{transform:translate(var(--drift),110vh) rotate(var(--spin));opacity:0}
}
@media(max-height:650px){
 main{padding:8px}
 .stage{height:48vh;min-height:260px}
 h1{margin:6px}
}
</style>
</head>
<body>
<div id="stars"></div>
<div id="rain"></div>

<main>
 <div class="small">GỬI MỘT CHÚT DỊU DÀNG · 20/10</div>
 <h1>Một bông hồng<br>dành riêng cho em</h1>
 <p class="subtitle">Hãy chạm vào trái tim để hoa nở nhé…</p>

 <section class="stage">
  <button id="bud" aria-label="Chạm để hoa nở">
   ♥<span>CHẠM VÀO TRÁI TIM ✨</span>
  </button>

  <svg viewBox="0 0 400 470" role="img" aria-label="Một bông hồng đỏ đang nở">
   <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
     <stop stop-color="#ffb9ce"/>
     <stop offset=".35" stop-color="#f63269"/>
     <stop offset=".72" stop-color="#c30a43"/>
     <stop offset="1" stop-color="#650823"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
     <stop stop-color="#ffe0e9"/>
     <stop offset=".45" stop-color="#ff739c"/>
     <stop offset="1" stop-color="#b90a43"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
     <stop stop-color="#18552f"/>
     <stop offset=".5" stop-color="#70c778"/>
     <stop offset="1" stop-color="#215f37"/>
    </linearGradient>
    <radialGradient id="center">
     <stop stop-color="#ffb2c8"/>
     <stop offset=".45" stop-color="#e51d57"/>
     <stop offset="1" stop-color="#81082f"/>
    </radialGradient>
   </defs>

   <g id="rose">
    <!-- Thân cây mọc lên -->
    <path class="stem" d="M200 195 C197 260 211 325 200 425"/>

    <!-- Lá mở ra sau khi thân mọc -->
    <path class="leaf" style="animation-delay:1.1s"
      d="M202 315 C164 304 142 278 145 254
      C178 259 201 281 202 315Z"/>
    <path class="leaf" style="animation-delay:1.35s"
      d="M205 355 C238 334 258 309 256 287
      C225 294 207 321 205 355Z"/>
    <path class="leaf" style="animation-delay:1.5s"
      d="M199 386 C171 373 160 355 163 339
      C185 344 198 363 199 386Z"/>

    <!-- Đài hoa -->
    <g class="petal" style="animation-delay:.45s">
     <path d="M200 203 Q162 187 151 164
       Q185 174 200 192 Q215 174 249 164
       Q238 190 200 203Z" fill="url(#green)"/>
    </g>

    <!-- CÁNH NGOÀI: mở rộng ra hai bên -->
    <g class="petal" style="animation-delay:.65s">
     <path d="M199 191
       C158 199 117 169 125 130
       C130 105 154 97 171 116
       C184 130 187 158 199 191Z"
       fill="url(#red)"/>
     <path d="M137 126 Q140 108 157 112"
       fill="none" stroke="#ffd4e1" stroke-width="2" opacity=".8"/>
    </g>

    <g class="petal" style="animation-delay:.8s">
     <path d="M201 191
       C242 199 283 169 275 130
       C270 105 246 97 229 116
       C216 130 213 158 201 191Z"
       fill="url(#red)"/>
     <path d="M263 126 Q260 108 243 112"
       fill="none" stroke="#ffd4e1" stroke-width="2" opacity=".8"/>
    </g>

    <!-- Cánh lớn phía sau -->
    <g class="petal" style="animation-delay:1s">
     <path d="M198 188
       C163 157 166 104 197 78
       C213 64 231 84 225 111
       C220 139 208 165 198 188Z"
       fill="url(#light)"/>
     <path d="M201 188
       C237 157 234 104 203 78
       C187 64 169 84 175 111
       C180 139 192 165 201 188Z"
       fill="url(#red)"/>
    </g>

    <!-- Cánh hai bên lớp giữa -->
    <g class="petal" style="animation-delay:1.2s">
     <path d="M198 190
       C151 178 139 137 163 111
       C181 93 201 119 202 145
       C205 164 202 179 198 190Z"
       fill="url(#red)"/>
    </g>
    <g class="petal" style="animation-delay:1.35s">
     <path d="M202 190
       C249 178 261 137 237 111
       C219 93 199 119 198 145
       C195 164 198 179 202 190Z"
       fill="url(#light)"/>
    </g>

    <!-- Cánh cuộn vào trong -->
    <g class="petal" style="animation-delay:1.55s">
     <path d="M199 187
       C171 171 171 143 188 131
       C201 122 212 140 205 153
       C222 140 237 156 225 173
       C217 185 207 188 199 187Z"
       fill="url(#red)"/>
    </g>

    <g class="petal" style="animation-delay:1.75s">
     <path d="M198 181
       C183 164 191 145 203 147
       C218 149 215 164 204 170
       C223 163 230 180 215 190
       C207 195 201 190 198 181Z"
       fill="url(#center)"/>
    </g>

    <!-- Cuộn cánh nhỏ ở tâm -->
    <g class="petal" style="animation-delay:1.95s">
     <path d="M198 177
       C187 163 198 153 207 160
       C215 166 204 174 200 170
       C211 175 207 185 199 182Z"
       fill="#ffb6cb"/>
     <path d="M199 177 Q205 171 201 166"
       fill="none" stroke="#ffecf2" stroke-width="1.5"/>
    </g>

    <!-- Đường sáng trên cánh -->
    <path d="M164 119 Q179 103 190 126"
      fill="none" stroke="#ffe1e9" stroke-width="2" opacity=".65"/>
    <path d="M236 119 Q221 103 210 126"
      fill="none" stroke="#ffe1e9" stroke-width="2" opacity=".65"/>
   </g>

   <!-- Hạt sáng quanh bông hoa -->
   <g fill="#ffe4af">
    <circle cx="107" cy="157" r="2"/>
    <circle cx="293" cy="142" r="2"/>
    <circle cx="135" cy="211" r="1.5"/>
    <circle cx="272" cy="222" r="2"/>
    <circle cx="168" cy="62" r="1.5"/>
    <circle cx="241" cy="55" r="1.5"/>
   </g>
  </svg>
 </section>

 <p class="message" id="message">
  Chúc em luôn <em>xinh đẹp, rạng rỡ</em> và bình an.
  Mong mỗi ngày của em đều dịu dàng như cánh hoa,
  ngọt ngào như tình yêu và ngập tràn hạnh phúc. 🌹
 </p>

 <button class="action" id="wish">♡ Nhận thêm một lời chúc</button>
</main>

<script>
const stars=document.getElementById('stars');
const rain=document.getElementById('rain');

for(let i=0;i<75;i++){
 const s=document.createElement('span');
 s.className='star';s.textContent='✦';
 s.style.left=Math.random()*100+'%';
 s.style.top=Math.random()*100+'%';
 s.style.fontSize=(4+Math.random()*8)+'px';
 s.style.animationDelay=Math.random()*3+'s';
 stars.appendChild(s);
}

function fall(){
 const el=document.createElement('span');
 el.className='fall';
 el.textContent=Math.random()>.45?'♥':['❀','✿','🌸'][Math.floor(Math.random()*3)];
 el.style.left=Math.random()*100+'%';
 el.style.fontSize=(12+Math.random()*17)+'px';
 el.style.color=Math.random()>.5?'#ff8fb5':'#ffd1e0';
 el.style.animationDuration=(6+Math.random()*7)+'s';
 el.style.setProperty('--drift',((Math.random()-.5)*150)+'px');
 el.style.setProperty('--spin',((Math.random()-.5)*450)+'deg');
 rain.appendChild(el);
 setTimeout(()=>el.remove(),14000);
}

let timer;
document.getElementById('bud').addEventListener('click',()=>{
 document.body.classList.add('open');
 for(let i=0;i<25;i++)setTimeout(fall,i*120);
 clearInterval(timer);
 timer=setInterval(fall,550);
});

const wishes=[
'Chúc em luôn <em>xinh đẹp, rạng rỡ</em> và bình an. Mong những điều ngọt ngào nhất sẽ đến với em. 🌹',
'Mong nụ cười luôn ở trên môi, niềm vui luôn trong tim và mỗi ngày đều có một điều đáng nhớ. 💗',
'Em xứng đáng với mọi điều dịu dàng nhất trên thế gian. Chúc em một ngày 20/10 thật hạnh phúc. 🌷',
'Mong em luôn tự tin tỏa sáng, được yêu thương, trân trọng và nâng niu theo cách em xứng đáng. ✨'
];
let index=0;
document.getElementById('wish').addEventListener('click',()=>{
 index=(index+1)%wishes.length;
 document.getElementById('message').innerHTML=wishes[index];
 for(let i=0;i<10;i++)setTimeout(fall,i*100);
});
</script>
</body>
</html>
